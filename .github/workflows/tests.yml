name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  live-data-smoke:
    # Проверява дали източниците на данни са достъпни от GitHub runner-а.
    # Не записва нищо в репото; ако провайдър се провали, виж лога.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe data source endpoints (diagnostics)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker probe grep "https://dskam.bg/ResourcePackages/DSKAssetsManagement/assets/dist/js/main.js?v=20260513104338" "investor-form|js-field-select-fund|datepicker_from|investment-helper|fund_type" --head 900
          python -m fund_tracker probe grep "https://dskam.bg/" "<script[^>]*>[^<]{0,200}(fund_type|investor|datepicker)" --head 2500
          python -m fund_tracker probe grep "https://dskam.bg/funds/balance/" "currentRate|history|istoria|chart|Highcharts|json|ajax" --head 500

      - name: Download live data into a temporary database
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker --db /tmp/smoke.sqlite update --strict || echo "::warning::Some funds failed – see log above"
          python -m fund_tracker --db /tmp/smoke.sqlite status
