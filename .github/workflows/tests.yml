name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  live-data-smoke:
    # Проверява дали източниците на данни са достъпни от GitHub runner-а.
    # Не записва нищо в репото; ако провайдър се провали, виж лога.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe data source endpoints (diagnostics)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker probe bamosz2 HU0000729793
          python -m fund_tracker probe forms "https://dskam.bg/funds/balance/.currentRate"
          python -m fund_tracker probe forms "https://dskam.bg/?fund_type=0&fund_name=5&datepicker_from=01.01.2024&datepicker_to=10.10.2026"
          python -m fund_tracker probe grep "https://dskam.bg/ResourcePackages/DSKAssetsManagement/assets/dist/js/main.js?v=20260513104338" "mutualUnitValues|currentRate|fund_name" --head 600
          python -m fund_tracker probe grep "https://dskam.bg/" "mutualUnitValues|submit_button_" --head 1200

      - name: Download live data into a temporary database
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker --db /tmp/smoke.sqlite update --strict || echo "::warning::Some funds failed – see log above"
          python -m fund_tracker --db /tmp/smoke.sqlite status
