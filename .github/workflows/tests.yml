name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

  live-data-smoke:
    # Проверява дали източниците на данни са достъпни от GitHub runner-а.
    # Не записва нищо в репото; ако провайдър се провали, виж лога.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe data source endpoints (diagnostics)
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker probe url "https://dskam.bg/Frontend-Assembly/SitefinityWebApp/Mvc/Scripts/MutualFund/mutualFundUnitValuesChart.js?package=DSKAssetsManagement" --head 12000
          python -m fund_tracker probe url "https://dskam.bg/ResourcePackages/DSKAssetsManagement/assets/dist/js/mutualFundHelper.js" --head 12000

      - name: Download live data into a temporary database
        env:
          PYTHONPATH: src
        run: |
          python -m fund_tracker --db /tmp/smoke.sqlite update --strict || echo "::warning::Some funds failed – see log above"
          python -m fund_tracker --db /tmp/smoke.sqlite status
