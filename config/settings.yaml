# Общи настройки на проекта.

dca:
  # Сума, която влагаш във всеки фонд всеки месец (във валутата на фонда; за EUR фондовете – евро).
  monthly_amount: 10
  # Ден от месеца, на който купуваш дялове. Ако няма цена за този ден, се взима първата следваща.
  purchase_day: 15
  # От кога реално инвестираш по този план. Ползва се за раздела "Моят план".
  # Редактирай според първата ти реална покупка.
  my_plan_start: 2025-10-15
  # Прилагай входната такса от funds.yaml (entry_fee_pct) при симулацията.
  apply_entry_fee: true

report:
  title: Fund Performance Tracker
  # Езикът на отчета: bg
  language: bg
  # Брой фондове, които са избрани по подразбиране в сравнителната графика (макс. 8).
  default_compare: 6

data:
  # Фиксиран курс BGN → EUR (валутен борд / приемане на еврото)
  bgn_per_eur: 1.95583
  # Колко дни назад да презареждаме при всяко обновяване (за коригирани стойности)
  refresh_overlap_days: 45
  # Най-ранна дата, от която да се търси история при първоначално сваляне
  history_start: 1995-01-01
