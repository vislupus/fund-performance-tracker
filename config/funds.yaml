# Списък с фондове, които се следят.
#
# group:   portfolio  – фондове, в които реално инвестираш (влизат в "Моят портфейл")
#          watchlist  – фондове, които обмисляш (следят се и се симулират, но не са в портфейла)
#          benchmark  – сравнителен индекс/ETF
# currency: валутата на класа дялове. За BGN NAV се преизчислява в EUR по фиксирания курс.
# inception: дата на старт на фонда (само информативно; историята се сваля докъдето има данни)
# entry_fee_pct: входна такса в проценти, прилага се в DCA симулацията (0 = без такса).
#            ДСК: 1,50% при еднократна покупка, 0,75% при инвестиционен план (акционни фондове).
# ongoing_charges_pct: текущи годишни разходи на фонда (от KID/фактшийт), само информативно –
#            те вече са удържани в NAV и не се изваждат повторно. Поддържа се ръчно.
# providers: ред на източниците, които се опитват. Ако липсва, се ползва ред по подразбиране
#            според ISIN (HU → bamosz, ft, investing; BG → dskam, ft, investing;
#            други → ft, investing, morningstar).
# ids:      незадължителни "подсказки" към източниците, ако автоматичното търсене по ISIN
#            намери грешен клас дялове:
#              ft_symbol:          напр. "LU0106235533:EUR" или "EUNL:GER:EUR"
#              investing_pair_id:  числовото pair_ID в Investing.com
#              investing_query:    текст за търсене вместо ISIN
#              morningstar_secid:  напр. "F0GBR04N6K"
#              dskam_id:           номер на фонда в dskam.bg (5 = ДСК Баланс, 20 = ДСК Растеж, 15 = ДСК Стандарт,
#                                  90 = ДСК Динамика, 85 = ДСК Глобални компании, 426 = ДСК-ОТП Премиум Микс)

